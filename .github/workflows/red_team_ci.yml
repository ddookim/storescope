name: Red Team + Blue Team CI (verified tools + debate)

# 2026-07-29 D+58 도입: 사용자 red team 라운드 반복 발견 문제들의 영구 자동 검증.
# 도입 tool:
#   - Lighthouse CI (treosh/lighthouse-ci-action@v12) — perf/a11y/SEO (Google 공식)
#   - gitleaks (gitleaks/gitleaks-action@v3) — secret scan (15k+ stars)
#   - semgrep (returntocorp/semgrep-action) — 커스텀 룰 (경쟁사 + 개인정체 + 거짓광고 + SQL injection)
#   - deploy/red_team_lint.sh — StoreScope 전용 룰 (i18n dupe, CJK overflow, dead code)
#   - deploy/verify_landing.sh — 기존 프로젝트 검증

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'api/**'
      - 'services/**'
      - 'pipeline/**'
      - 'outreach/**'
      - 'scripts/**'
      - '.semgrep.yml'
      - 'lighthouserc.json'
      - 'deploy/verify_landing.sh'
      - 'deploy/red_team_lint.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # SARIF upload

concurrency:
  group: red-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: 🔴 RED TEAM + 🛡 BLUE TEAM debate ─────
  # 병행 실행 후 debate report 출력 — 어느 쪽이 우세한지 각 룰별 판정.
  red-vs-blue-debate:
    name: 🔴 Red vs 🛡 Blue debate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: verify_landing (project 관례)
        run: bash deploy/verify_landing.sh landing/index.html

      - name: 🔴 Red Team — 공격 벡터 hunt
        id: red
        run: bash deploy/red_team_lint.sh
        continue-on-error: true

      - name: 🛡 Blue Team — 방어 태세 verify
        id: blue
        run: bash deploy/blue_team_defense.sh
        continue-on-error: true

      - name: 🏛 Debate Verdict
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  🏛 DEBATE VERDICT"
          echo "═══════════════════════════════════════════════"
          echo "  🔴 Red Team exit:  ${{ steps.red.outcome }}"
          echo "  🛡 Blue Team exit: ${{ steps.blue.outcome }}"
          echo ""
          if [ "${{ steps.red.outcome }}" = "failure" ]; then
            echo "  ✗ Red team 승 — 공격 벡터 확인. Blue team 방어 gap 확인 필요."
            exit 1
          elif [ "${{ steps.blue.outcome }}" = "failure" ]; then
            echo "  ⚠ Blue team gap — 방어 태세 미비. Red team 공격 없어도 잠재 위험."
            exit 1
          else
            echo "  ✓ 균형 — Red team 공격 벡터 0, Blue team 방어 태세 완비."
          fi

  # ─── Job 2: Lighthouse CI (perf/a11y/SEO) ────────────
  lighthouse:
    name: Lighthouse CI (a11y + perf + SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit landing/index.html
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ─── Job 3: gitleaks (secret scan) ────────────
  gitleaks:
    name: gitleaks (secret detection)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks 전체 히스토리 스캔

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE 는 개인 계정에서 불필요 (org 만 필요)

  # ─── Job 4: semgrep (custom rules) ────────────
  semgrep:
    name: semgrep (competitor + identity + false-ads + SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep with .semgrep.yml + community p/security
        run: |
          semgrep scan \
            --config=.semgrep.yml \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            --exclude-rule=generic.secrets.security.detected-generic-api-key.detected-generic-api-key \
            .
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  # ─── Job 5: Python static check (backend agents 지원) ─────
  pycompile:
    name: py_compile (backend syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile check all Python files
        run: |
          find api services pipeline scripts -name "*.py" -type f 2>/dev/null | xargs python3 -m py_compile
          echo "✓ py_compile clean"

  # ─── Job 6: 🛡 Blue Team — bandit (Python SAST) ─────────
  # PyCQA 공식 Python 보안 정적 분석 (47 checks × 7 카테고리)
  bandit:
    name: 🛡 bandit (Python SAST — PyCQA 공식)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (HIGH severity only, SARIF)
        run: |
          bandit -r api services pipeline scripts \
            --severity-level high \
            --confidence-level medium \
            --format sarif \
            --output bandit.sarif \
            --exit-zero \
            || true
          # 인간 읽기용 요약도 출력
          bandit -r api services pipeline scripts \
            --severity-level high \
            --confidence-level medium \
            --format screen \
            || true

      - name: Upload bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true

  # ─── Job 7: 🛡 Blue Team — pip-audit (dep vuln) ─────────
  # PyPA 공식 (Trail of Bits + Google 유지관리) - PyPI + OSV DB 스캔
  pip-audit:
    name: 🛡 pip-audit (dep CVE — PyPA 공식)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run pip-audit on requirements.txt
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          # local: true  # 로컬 pip env 대신 requirements.txt 만 스캔
        continue-on-error: true  # 취약점 발견 시에도 workflow 계속 (SARIF 리포트만)
