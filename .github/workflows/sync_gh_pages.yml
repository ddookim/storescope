name: Sync landing → gh-pages

# main 의 landing/index.html 또는 outreach/evidence/ 변경 시 gh-pages 브랜치로 자동 sync.
# 이전엔 수동 sync (chore: landing deploy YYYY-MM-DD 커밋) — 잊음 위험.
# 2026-07-29 D+58 도입: main push 후 라이브 반영까지 사용자 개입 0.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'outreach/evidence/**'
  workflow_dispatch:

# SEC: 최소 권한 (contents:write 만 필요 — gh-pages 브랜치 push).
permissions:
  contents: write

# 중복 실행 차단
concurrency:
  group: sync-gh-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main (full history for branch operations)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync files from main to gh-pages
        run: |
          set -euo pipefail

          # gh-pages worktree 생성
          git worktree add /tmp/gh-pages-wt gh-pages

          # 파일 sync (main → gh-pages)
          # 2026-08-01 확장: manifest, robots, sitemap, sub pages, blog directory 모두 sync
          cp landing/index.html /tmp/gh-pages-wt/index.html
          mkdir -p /tmp/gh-pages-wt/landing
          cp -r landing/* /tmp/gh-pages-wt/landing/
          # Root SEO 파일도 복사 (Netlify 정합)
          cp landing/robots.txt /tmp/gh-pages-wt/robots.txt 2>/dev/null || true
          cp landing/sitemap.xml /tmp/gh-pages-wt/sitemap.xml 2>/dev/null || true
          cp landing/manifest.json /tmp/gh-pages-wt/manifest.json 2>/dev/null || true
          # D+14 Blue Team step5: IndexNow key 파일 root 배포 (Bing/Yandex/Naver/Seznam 검증용).
          # 검증은 https://ddookim.github.io/storescope/<key>.txt 에서 이루어짐 (keyLocation param).
          cp landing/1a13761481f3939465dac5fa481799b8.txt /tmp/gh-pages-wt/1a13761481f3939465dac5fa481799b8.txt 2>/dev/null || true
          # D+12 bug fix: 404.html root 필수 (GH Pages 는 root/404.html 만 custom 404 로 사용).
          # 이전엔 landing/404.html 만 있어 nonexistent path 시 generic GH 404 반환.
          cp landing/404.html /tmp/gh-pages-wt/404.html 2>/dev/null || true
          # D+12: og-image.png root 도 (호환성; 일부 크롤러 root 우선 fetch).
          cp landing/og-image.png /tmp/gh-pages-wt/og-image.png 2>/dev/null || true
          # D+11: digest-sample.html 도 root (canonical URL 정합)
          if [ -f landing/digest-sample.html ]; then
            cp landing/digest-sample.html /tmp/gh-pages-wt/digest-sample.html
          fi
          # D+11: latest_products.json 도 root (landing hero mock overlay 대상)
          if [ -f landing/latest_products.json ]; then
            cp landing/latest_products.json /tmp/gh-pages-wt/latest_products.json
          fi
          # D+11: RSS feed 도 root (autodiscovery + Feedly 등 reader 표준)
          if [ -f landing/feed.xml ]; then
            cp landing/feed.xml /tmp/gh-pages-wt/feed.xml
          fi
          # D+12 fix: blog/ 도 root — sitemap 의 /storescope/blog/* URL 이 3개월간 404 였던 원인.
          # (기존 landing/blog/index.html + 5 posts + D+12 weekly-YYYY-WNN.html)
          if [ -d landing/blog ]; then
            mkdir -p /tmp/gh-pages-wt/blog
            cp -r landing/blog/* /tmp/gh-pages-wt/blog/
          fi
          # D+12: brands/ 도 root — 58 브랜드 프로필 페이지 (SEO surface).
          if [ -d landing/brands ]; then
            mkdir -p /tmp/gh-pages-wt/brands
            cp -r landing/brands/* /tmp/gh-pages-wt/brands/
          fi
          # D+14 Red Tactic 2: compare/ 도 root — 5 'StoreScope vs X' bottom-funnel SEO 페이지.
          # 사이트맵에 /storescope/compare/* 로 등록되어 있으므로 root 서빙 필수.
          if [ -d landing/compare ]; then
            mkdir -p /tmp/gh-pages-wt/compare
            cp -r landing/compare/* /tmp/gh-pages-wt/compare/
          fi
          # D+14 Red Tactic 3 pivot: category/ 도 root — 7 programmatic category 페이지.
          # 실 data 근거 (latest_products_meta categories) + weekly refresh.
          if [ -d landing/category ]; then
            mkdir -p /tmp/gh-pages-wt/category
            cp -r landing/category/* /tmp/gh-pages-wt/category/
          fi
          # D+14 Red Tactic 5: report/ 도 root — State of DTC 데이터 리포트 (backlink bait).
          # 매주 pipeline 이 신규 report 생성 예정 (현재는 static W33, priority 0.9 for freshness signal).
          if [ -d landing/report ]; then
            mkdir -p /tmp/gh-pages-wt/report
            cp -r landing/report/* /tmp/gh-pages-wt/report/
          fi
          mkdir -p /tmp/gh-pages-wt/outreach/evidence
          if [ -d outreach/evidence ]; then
            cp -r outreach/evidence/* /tmp/gh-pages-wt/outreach/evidence/ 2>/dev/null || true
          fi

          # 변경 여부 확인 + 커밋
          # D+11 fix: 이전 'git diff --quiet' 는 UNTRACKED 파일 (신규 root file) 놓침
          # → 신규 digest-sample.html root copy 후 'no changes' 오탐.
          # git status --porcelain 는 tracked + untracked 모두 lines out.
          cd /tmp/gh-pages-wt
          git add -A   # tracked + untracked 모두 stage
          if git diff --cached --quiet; then
            echo "No changes to sync — skip commit"
            exit 0
          fi

          git commit -m "chore: landing deploy $(date -u +%Y-%m-%d) (auto-sync from ${GITHUB_SHA:0:7})"
          git push origin gh-pages

      - name: Cleanup worktree
        if: always()
        run: |
          git worktree remove /tmp/gh-pages-wt --force 2>/dev/null || true

      # D+14 Blue Team Musk step5 (automate): SEO 재색인 요청.
      # Google 은 2023-06 sitemap ping 엔드포인트를 공식 폐지 — 호출하지 않음 (죽은 자동화 광고 금지).
      # Bing 은 ping 엔드포인트 유지. IndexNow 는 Bing/Yandex/Naver/Seznam 동시 커버.
      # 실패해도 배포 자체는 이미 완료된 상태이므로 이 스텝은 non-blocking (|| true).
      - name: Ping search engines (Bing + IndexNow)
        run: |
          SITEMAP_URL="https://ddookim.github.io/storescope/sitemap.xml"
          HOST="ddookim.github.io"
          KEY="1a13761481f3939465dac5fa481799b8"
          KEY_LOCATION="https://ddookim.github.io/storescope/${KEY}.txt"

          echo "[seo-ping] Bing sitemap ping..."
          curl -sS -o /dev/null -w "  bing status=%{http_code}\n" --max-time 15 \
            "https://www.bing.com/ping?sitemap=${SITEMAP_URL}" || true

          echo "[seo-ping] IndexNow submit (Bing/Yandex/Naver/Seznam)..."
          curl -sS -o /dev/null -w "  indexnow status=%{http_code}\n" --max-time 15 \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"${HOST}\",\"key\":\"${KEY}\",\"keyLocation\":\"${KEY_LOCATION}\",\"urlList\":[\"https://ddookim.github.io/storescope/\",\"${SITEMAP_URL}\"]}" \
            || true
