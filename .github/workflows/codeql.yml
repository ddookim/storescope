name: 🛡 CodeQL (GitHub 공식 semantic security)

# GitHub 공식 CodeQL — Python + JavaScript semantic analysis.
# bandit 은 pattern-based, CodeQL 은 data-flow / taint tracking 으로 더 깊은 취약점 감지.
# 2026-04 GA (Actions workflow security 포함). Free for public repos.
# Source: github/codeql-action (GitHub 자체 운영, 공급망 리스크 최저).

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.html'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # 매주 월요일 UTC 03:00 (dep 업데이트 후 재스캔)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF 업로드
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality = 기본보다 확장 (correctness + security)
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{matrix.language}}
