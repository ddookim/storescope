name: Weekly Pipeline (Crawl + Cluster + Trend)

# 매주 일요일 23:00 UTC = 월요일 08:00 KST.
# 마스터플랜의 "월요일 아침에 winners 리스트" 약속을 자동 충족.
# GitHub Actions free tier: 2000 min/mo (현재 작업량 ~30분/주 = 120 min/mo 사용).
#
# Render Cron Job은 유료 ($1+/mo) → GH Actions로 대체.
#
# 실행:
#   1. NEON_DB_URL 시크릿 등록: GitHub repo → Settings → Secrets → Actions → New
#   2. (선택) TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿 등록
#   3. 첫 실행: Actions 탭 → "Weekly Pipeline" → Run workflow (수동 트리거 가능)

on:
  schedule:
    - cron: "0 23 * * 0"  # 일요일 23:00 UTC
  workflow_dispatch:       # 수동 트리거 허용 (디버깅 + 첫 실행용)

# SEC: DB-less 모드 (NEON_DB_URL 미설정) 에서만 data/*.json 커밋 back 필요.
# DB 모드에서는 read 만으로 충분 (data 는 DB 로 이동).
permissions:
  contents: write

# 동시 실행 차단 — 동일 시간에 두 잡이 안 돌게.
concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 1시간 상한 (free tier 보호)
    env:
      DATABASE_URL: ${{ secrets.NEON_DB_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # DB-less 모드에서 data/*.json commit back 하려면 push 권한이 있는 token 필요.
          # 기본 GITHUB_TOKEN 은 persist-credentials=true 로 자동 wire 되지만 명시.
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (DB-less crawl+cluster if NEON_DB_URL empty)
        run: |
          # DATABASE_URL 없으면 --from 2 --to 3 (crawl+cluster only, JSON output, skip Wayback).
          # 있으면 --from 1 (full 1~4).
          #
          # WHY skip STEP 1 in DB-less mode:
          #   Wayback Machine CDX API (STEP 1) 503/504/timeout 반복 (D+10 실측: 18분 재시도 폭풍
          #   → 1,165 stores 성공, 이는 committed shopify_stores.txt 3,412 stores 대비 후퇴).
          #   Seed list 는 이미 committed 되어 있으므로 STEP 1 을 skip 해도 fresh crawl 가능.
          #   신규 store discovery 는 필요 시 별도 monthly workflow 로 분리 (deferred).
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL 미설정 → DB-less 모드 (steps 2-3, committed seed 3412 stores, Wayback skip)"
            python run_pipeline.py --from 2 --to 3
          else
            echo "::notice::DATABASE_URL 설정됨 → full 모드 (steps 1-4, Wayback re-discovery 포함)"
            python run_pipeline.py --from 1
          fi

      - name: Send JSON digest (DB-less mode, dry-run default)
        if: success() && env.DATABASE_URL == ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_FORM_ID: ${{ secrets.NETLIFY_FORM_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          # Kill-switch env: set STORESCOPE_DIGEST_DRY_RUN=false in repo variables to enable real send
          DRY_RUN_FLAG: ${{ vars.STORESCOPE_DIGEST_DRY_RUN != 'false' && '--dry-run' || '' }}
        run: |
          # SMTP env 미설정 시 코드가 auto dry-run + CRITICAL alert. workflow 성공 유지.
          # sent_log.json 은 다음 commit 스텝에서 함께 push.
          python services/send_json_digest.py $DRY_RUN_FLAG || {
            echo "::warning::send_json_digest exited non-zero — see log above"
          }

      - name: Commit fresh data + sent_log (DB-less mode only)
        if: success() && env.DATABASE_URL == ''
        run: |
          # WARN: data/*.json 은 .gitignore 에 포함됨 (초기 커밋 시 too-large 우려).
          # DB-less 모드에서는 이게 유일한 데이터 소스 → git add -f 로 강제 트래킹.
          # Trending.json size 실측 813KB, clusters.json 6.3MB → GH 리포지토리 크기 무리 없음.
          git config user.name  "storescope-bot"
          git config user.email "bot@storescope.local"
          git add -f data/trending.json data/clusters.json data/sent_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::No data changes to commit"
          else
            git commit -m "chore(data): weekly refresh $(date -u +%F) [skip ci]"
            git push origin HEAD:main
            echo "::notice::Fresh data + sent_log pushed to main"
          fi

      - name: Health check after pipeline (DB 모드만)
        if: success() && env.DATABASE_URL != ''
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM clusters')
          n_clusters = cur.fetchone()[0]
          cur.execute('SELECT COUNT(*) FROM products')
          n_products = cur.fetchone()[0]
          print(f'clusters={n_clusters} products={n_products}')
          assert n_clusters > 1000, f'clusters too few: {n_clusters}'
          assert n_products > 100000, f'products too few: {n_products}'
          print('Health check PASS')
          "

      - name: Send weekly digest emails (DB 모드만, D+29 wiring)
        if: success() && env.DATABASE_URL != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BASE_URL: ${{ secrets.BASE_URL }}
          # /unsubscribe endpoint 가 FastAPI 에 있음 → API_BASE_URL 필수 (없으면 BASE_URL fall back = dead link).
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # HMAC token 검증을 위해 api/main.py 와 동일 secret 사용.
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          # non-block: SMTP 미설정 시 코드가 graceful skip + CRITICAL alert. workflow 성공 유지.
          # at-most-once: email_deliveries UNIQUE 제약이 중복 발송 차단.
          python services/send_weekly_digests.py || {
            echo "::warning::send_weekly_digests exited non-zero — see Telegram alert for details"
          }

      - name: Notify success (Telegram, optional)
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ StoreScope weekly pipeline completed at $(date -u +%FT%TZ)" \
            --max-time 10 > /dev/null

      - name: Notify failure (Telegram, optional)
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🚨 StoreScope weekly pipeline FAILED at $(date -u +%FT%TZ) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --max-time 10 > /dev/null
