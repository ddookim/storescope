name: Python tests (unit + integration)

# StoreScope 백엔드 테스트 — 16 test files 이 3개월 존재만 하고 CI 실행 X (D+11 발견).
# 매 push + PR 마다 실행. 실패 시 workflow fail (main branch protection 대응).

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'pipeline/**'
      - 'services/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      # ephemeral test DB in CI service container — trust auth, no password (not a real secret).
      DATABASE_URL: "postgresql://postgres@localhost:5432/storescope_test"
      ADMIN_SECRET: "test_admin_secret_min_32_chars_here_lololol"
      PADDLE_WEBHOOK_SECRET: "test_webhook_secret"
      PADDLE_PRO_PRICE_ID: "pri_pro_test"
      PADDLE_STARTER_PRICE_ID: "pri_starter_test"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: storescope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # reportlab: test_xss_email_templates 의 PDF 생성 테스트용 (프로덕션 dep 아님, dev only).
          pip install -r requirements.txt pytest reportlab

      - name: Apply schema migrations
        run: |
          # tests/conftest.py 는 스키마 없이 raw 쿼리 → migrations/ SQL 순차 적용.
          for sql in migrations/*.sql; do
            [ -f "$sql" ] && psql -h localhost -U postgres -d storescope_test -f "$sql" 2>&1 | tail -3
          done

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            --ignore=tests/test_paddle_webhook_integration.py \
            -q
